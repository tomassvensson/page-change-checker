name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci --engine-strict

      - name: Check CI configuration
        run: npm run check:ci

      - name: Check SonarCloud authentication before expensive checks
        env:
          SONAR_CLOUD_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: npm run check:sonar-auth

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check publication history
        run: npm run publication:check -- --history

      - name: Run verification
        run: npm run verify

      - name: Run SonarQube Cloud scan
        timeout-minutes: 10
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  windows-reliability:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci --engine-strict
      - name: Build
        run: npm run build
      - name: Install Chromium for production-path regressions
        run: npx playwright install chromium
      - name: Exercise native persistence and reliability policies
        run: >-
          npx vitest run monitorJournal monitorHistory monitorReplay monitorVisual
          monitorHealth fileLock monitorOperations monitorRules monitorDelivery
          monitorCoordinator monitorActivity monitorCapture monitorReadiness monitorMailDiagnostics
          monitorPipeline monitorRuntime cliDurability

  postgres-reliability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci --engine-strict
      - name: Exercise PostgreSQL rollback and retry
        env:
          PCC_TEST_PSQL: psql
          PGPASSWORD: synthetic-ci-only
        run: npx vitest run tests/integration/monitorPostgres.test.ts

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install check tooling
        env:
          HUSKY: 0
        run: npm ci --engine-strict
      - name: Exercise shared container checks
        run: npm run check:docker
