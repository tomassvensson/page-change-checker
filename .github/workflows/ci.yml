name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run verification
        run: npm run verify

      - name: Run SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate YAML files
        run: |
          find . \
            -name '*.yml' -o -name '*.yaml' \
            | grep -v node_modules \
            | grep -v coverage \
            | xargs -I{} sh -c 'python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" {} && echo "OK: {}" || exit 1'

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate docker-compose config
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build --tag page-change-checker:ci .
