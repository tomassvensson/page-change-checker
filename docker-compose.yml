services:
  page-change-checker:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 1m
    read_only: true
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /home/node/.cache:rw,noexec,nosuid,size=128m
      - /home/node/.config:rw,noexec,nosuid,size=16m
    volumes:
      # Persistent SQLite database + Playwright browser profile
      - ./data:/app/data
      # Config file (read-only inside the container)
      - ./config.json:/app/config.json:ro
      # Screenshots saved by the container are accessible on the host
      - ./screenshots:/app/screenshots
    environment:
      TZ: Europe/Berlin
    # Config strings may reference exact environment values as "${NAME}".
    # Keep secrets in an ignored .env file or an external secrets manager.
    # env_file:
    #   - .env
